<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clarity — Hello, world!</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 640px; padding: clamp(28px, 7vw, 64px); border: 1px solid #334155; border-radius: 24px; background: #1e293b; }
      .brand { color: #67e8f9; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
      h1 { margin: 24px 0 16px; font-size: clamp(36px, 8vw, 60px); line-height: 1.1; letter-spacing: -2px; }
      p { color: #cbd5e1; font-size: 18px; line-height: 1.6; }
      button { margin-top: 16px; padding: 14px 22px; border: 0; border-radius: 12px; background: #67e8f9; color: #0f172a; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #a5f3fc; }
      button:focus-visible { outline: 3px solid #f8fafc; outline-offset: 4px; }
      #message { min-height: 58px; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">CLARITY</span>
      <h1>Hello, world!</h1>
      <p>Seu projeto começou. Esta é a primeira página do Clarity.</p>
      <button type="button" id="hello">Dizer olá</button>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script>
      document.getElementById('hello').addEventListener('click', () => {
        document.getElementById('message').textContent = 'Olá! Tudo pronto para começar. 👋';
      });
    </script>
  </body>
</html>
